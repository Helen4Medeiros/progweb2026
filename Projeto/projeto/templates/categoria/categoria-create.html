{% extends "base.html" %}
{% load static %}

{% block title %}Nova Categoria{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}

{% block content %}
<div id="content">
    <div class="container">

        <form method="POST" action="/categoria/create">
            {% csrf_token %}

            <div class="row">
                <label class="col-md-2">
                    Categoria
                </label>

                <div class="col-md-4">
                    <input name="Categoria" class="form-control">
                </div>
            </div>

            <div class="row">
                <button type="submit" class="btn btn-danger col-md-2 mt-3 mr-2">
                    <i class="fa fa-check"></i> Inserir
                </button>

                <a href="{% url 'categoria' %}" class="btn bg-secondary col-md-2 mt-3">
                    <i class="fa fa-rotate-left"></i> Retornar
                </a>
            </div>

        </form>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/home.js' %}"></script>
{% endblock %}
