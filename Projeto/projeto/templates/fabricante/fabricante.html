{% extends "base.html" %}

{% block content %}

<div id="content">
    <div class="container">
        <div class="alert alert-info">
        <a href="{% url 'create_fabricante' %}" 
        class="btn btn-primary">
        Novo Fabricante
        </a>

        Fabricantes encontrados 
        [{{fabricantes|length}}]
        </div>
        {% for fabri in fabricantes %}
            <div class="row">
                <h5 class="col-md-3">{{fabri.Fabricante}}</h5>
                
                <a href="{% url 'details_fabricante' fabri.id %}"
                class="btn btn-primary mb-2 mr-2">
                Ver
                </a>

                <a href="{% url 'edit_fabricante' fabri.id %}"
                class="btn bg-secondary mb-2 mr-2">
                Editar
                </a>
                
                <a href="{% url 'delete_fabricante' fabri.id %}"
                class="btn btn-warning">
                Apagar
                </a>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
