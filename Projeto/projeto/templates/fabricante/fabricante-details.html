{% extends "base.html" %}
{% load static %}

{% block title %}Fabricante{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}

{% block content %}
<div id="content">
    <div class="container">

        <div class="row">
            <label class="col-md-2">Fabricante</label>

            <input value="{{ fabricante.Fabricante }}" disabled>
        </div>

        <div class="row">
            <a href="{% url 'fabricante' %}" class="btn bg-secondary col-md-2 mt-3">
                <i class="fa fa-rotate-left"></i> Retornar
            </a>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/home.js' %}"></script>
{% endblock %}
